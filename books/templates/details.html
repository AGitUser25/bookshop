{% extends "master.html" %}

{% block title %}
    Details about {{ book.name }}
{% endblock %}

{% block content %}
    <h1> {{ book.name }}</h1>
    <p> Author: {{ book.author }} </p>
    <p> Summary: {{ book.summary }} </p>
    <p> Price: {{ book.price }} </p>

    <p> Back to <a href="/books"> Books </a></p>
{% endblock %}
