{% extends "master.html" %}

{% block title %}
    My Bookshop - List of all books
{% endblock %}

{% block content %}

    <p><a href="/"> HOME </a></p>

    <h1> Books </h1>

    <ul>
        {% for book in mybooks %}
            <li><a href="details/{{ book.id }}"> {{ book.name }} by {{ book.author }} </a></li>
            <br>
        {% endfor %}
    </ul>
{% endblock %}
